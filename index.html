<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dilli Raj Bhatta — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1016; --bg-elev: #151a22; --bg-card: #121720;
    --text: #eceae4; --text-dim: #99a1ae; --line: #252b36;
    --trace: #5eead4; --trace-2: #60a5fa; --signal: #f5a623;
    --glow: rgba(94,234,212,.16); --shadow: 0 10px 30px rgba(0,0,0,.35);
    --font-head: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', 'Courier New', monospace;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f4f0; --bg-elev: #ffffff; --bg-card: #ffffff;
      --text: #14171c; --text-dim: #5a616e; --line: #dedcd5;
      --trace: #0c8a78; --trace-2: #2563eb; --signal: #c9720a;
      --glow: rgba(12,138,120,.13); --shadow: 0 10px 30px rgba(20,23,28,.08);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d1016; --bg-elev: #151a22; --bg-card: #121720;
    --text: #eceae4; --text-dim: #99a1ae; --line: #252b36;
    --trace: #5eead4; --trace-2: #60a5fa; --signal: #f5a623;
    --glow: rgba(94,234,212,.16); --shadow: 0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"] {
    --bg: #f5f4f0; --bg-elev: #ffffff; --bg-card: #ffffff;
    --text: #14171c; --text-dim: #5a616e; --line: #dedcd5;
    --trace: #0c8a78; --trace-2: #2563eb; --signal: #c9720a;
    --glow: rgba(12,138,120,.13); --shadow: 0 10px 30px rgba(20,23,28,.08);
  }
  html { scroll-padding-top: 70px; scroll-behavior: smooth; }
  * { box-sizing: border-box; }
  body {
    margin: 0; overflow-x: clip; background: var(--bg); color: var(--text);
    font-family: var(--font-head); line-height: 1.55; -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(var(--line) 1px, transparent 1px);
    background-size: 26px 26px; background-attachment: fixed;
  }
  a { color: inherit; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(24px, 5vw, 72px); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  /* scroll progress */
  .progress { position: fixed; top: 0; left: 0; height: 3px; width: 0; z-index: 30;
    background: linear-gradient(90deg, var(--trace), var(--trace-2)); }

  /* nav */
  nav.topnav {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 72px 12px clamp(24px, 5vw, 72px); background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px); border-bottom: 1px solid var(--line);
  }
  .nav-name {
    cursor: pointer; text-decoration: none;
    font-family: 'Space Grotesk', var(--font-head); font-weight: 700; font-size: 16px; letter-spacing: -0.02em;
    background: linear-gradient(90deg, var(--trace), var(--trace-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    transition: opacity .15s ease;
  }
  .nav-name:hover { opacity: .8; }
  nav.topnav ul { list-style: none; display: flex; gap: 22px; margin: 0; padding: 0; }
  nav.topnav a { text-decoration: none; font-family: var(--font-mono); font-size: 13px; color: var(--text-dim);
    border-bottom: 1px solid transparent; padding-bottom: 2px; transition: color .2s ease, border-color .2s ease; }
  nav.topnav a.active, nav.topnav a:hover { color: var(--text); border-color: var(--trace); }
  .theme-toggle { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); right: 16px; z-index: 40;
    width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
    background: var(--bg-elev); color: var(--text); border: 1px solid var(--line); box-shadow: var(--shadow);
    transition: transform .2s ease, border-color .2s ease, color .2s ease; }
  .theme-toggle:hover { border-color: var(--trace); color: var(--trace); transform: rotate(15deg) scale(1.06); }
  .theme-toggle svg { width: 20px; height: 20px; }

  .view.is-hidden { display: none; }
  nav.topnav ul { flex-wrap: wrap; }

  /* hero */
  header.hero { position: relative; padding: 72px 0 72px; scroll-margin-top: 70px; }
  header.hero::before {
    content: ''; position: absolute; inset: -120px -10vw -40px -10vw; pointer-events: none;
    background: radial-gradient(560px circle at var(--mx, 30%) var(--my, 35%), var(--glow), transparent 70%);
  }
  .hero-inner { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 40px; align-items: center; }
  .badge { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 12px;
    color: var(--text-dim); border: 1px solid var(--line); background: var(--bg-elev);
    padding: 6px 12px; border-radius: 999px; margin-bottom: 22px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--trace); box-shadow: 0 0 0 0 var(--trace); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
  .hello { font-family: var(--font-mono); font-size: 14px; color: var(--trace); margin: 0 0 6px; }
  h1 { font-size: clamp(2.4rem, 7vw, 4rem); line-height: 1.05; font-weight: 700; margin: 0 0 14px; letter-spacing: -0.03em; }
  h1 .grad { background: linear-gradient(90deg, var(--trace), var(--trace-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .role { font-family: var(--font-mono); font-size: clamp(15px, 2.4vw, 19px); color: var(--text); margin: 0 0 20px; min-height: 1.6em; }
  .cursor { display: inline-block; width: 9px; height: 1.05em; background: var(--trace); margin-left: 3px; vertical-align: text-bottom; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pitch { max-width: 56ch; color: var(--text-dim); font-size: 17px; margin: 0 0 30px; }
  .cta { display: flex; flex-wrap: wrap; gap: 12px; }
  .btn { text-decoration: none; font-size: 14px; font-weight: 600; padding: 12px 22px; border-radius: 10px;
    border: 1px solid var(--line); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
  .btn:hover { transform: translateY(-2px); }
  .btn.primary { background: linear-gradient(90deg, var(--trace), var(--trace-2)); color: #06120f; border-color: transparent; box-shadow: 0 8px 22px var(--glow); }
  .btn.ghost { background: var(--bg-elev); color: var(--text); }
  .btn.ghost:hover { border-color: var(--trace); }
  .avatar { width: 176px; height: 176px; margin: 8px 12px 8px 0; border-radius: 50%; display: grid; place-items: center; position: relative;
    font-size: 54px; font-weight: 700; letter-spacing: -0.03em; background: var(--bg-elev); }
  .avatar::before { content: ''; position: absolute; inset: -4px; border-radius: 50%; z-index: -1;
    background: conic-gradient(from 0deg, var(--trace), var(--trace-2), var(--signal), var(--trace)); animation: spin 8s linear infinite; }
  .avatar::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--bg-elev); z-index: -1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .avatar span { background: linear-gradient(135deg, var(--trace), var(--trace-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .stats { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-top: 56px; }
  .stat { background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; box-shadow: var(--shadow); }
  .stat b { display: block; font-size: 1.5rem; letter-spacing: -0.02em; }
  .stat small { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }

  /* sections */
  section { padding: 72px 0 8px; scroll-margin-top: 70px; }
  h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 30px; font-size: clamp(1.5rem, 3.5vw, 2rem); letter-spacing: -0.02em; }
  h2 small { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--trace); }
  h2::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--line), transparent); }

  /* timeline */
  .timeline { position: relative; padding-left: 30px; display: grid; gap: 18px; }
  .timeline::before { content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px;
    background: linear-gradient(var(--trace), var(--trace-2)); opacity: .5; }
  .t-item { position: relative; background: var(--bg-card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .t-item::before { content: ''; position: absolute; left: -29px; top: 26px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--bg); border: 3px solid var(--trace); }
  .t-when { font-family: var(--font-mono); font-size: 12px; color: var(--trace); }
  .t-item h3 { margin: 4px 0 2px; font-size: 1.1rem; }
  .t-item p { margin: 0; color: var(--text-dim); font-size: 15px; }

  /* skills */
  .skills { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .chip { font-family: var(--font-mono); font-size: 13px; padding: 8px 14px; border-radius: 999px; background: var(--bg-elev);
    border: 1px solid var(--line); transition: transform .15s ease, border-color .15s ease, color .15s ease; }

  /* projects */
  .projects { display: grid; gap: 18px; }
  details.project { background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 24px;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
  details.project summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 16px; padding: 20px 0; }
  details.project summary::-webkit-details-marker { display: none; }
  .p-num { font-family: var(--font-mono); font-size: 13px; color: var(--trace); }
  details.project summary h3 { margin: 0; flex: 1; font-size: 1.25rem; letter-spacing: -0.01em; }
  .p-toggle { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center;
    font-family: var(--font-mono); color: var(--trace); transition: transform .25s ease; }
  details.project[open] .p-toggle { transform: rotate(45deg); }
  .project-body { padding: 0 0 24px; border-top: 1px dashed var(--line); padding-top: 18px; }
  .project-body p { color: var(--text-dim); margin: 0 0 16px; max-width: 64ch; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .tag { font-family: var(--font-mono); font-size: 12px; padding: 4px 10px; border-radius: 6px;
    background: color-mix(in srgb, var(--trace) 10%, transparent); color: var(--trace); border: 1px solid color-mix(in srgb, var(--trace) 30%, transparent); }
  .code-link { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 10px 16px; border-radius: 10px; background: var(--bg-elev); border: 1px solid var(--line); transition: border-color .15s ease, transform .15s ease; }
  .code-link:hover { border-color: var(--trace); transform: translateY(-2px); }
  .code-link svg { width: 18px; height: 18px; }
  .p-actions { display: flex; flex-wrap: wrap; gap: 12px; }
  .demo-link { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-size: 14px; font-weight: 600;
    padding: 10px 16px; border-radius: 10px; color: #06120f; border: 1px solid transparent;
    background: linear-gradient(90deg, var(--trace), var(--trace-2)); box-shadow: 0 6px 18px var(--glow);
    transition: transform .15s ease, box-shadow .15s ease; }
  .demo-link:hover { transform: translateY(-2px); box-shadow: 0 10px 24px var(--glow); }
  .demo-link svg { width: 16px; height: 16px; }

  /* contact */
  .contact-box { background: var(--bg-card); border: 1px solid var(--line); border-radius: 20px; padding: 40px 28px; text-align: center; position: relative; overflow: hidden; }
  .contact-box::before { content: ''; position: absolute; inset: auto 0 -60% 0; height: 100%; background: radial-gradient(closest-side, var(--glow), transparent); pointer-events: none; }
  .contact-box p { position: relative; color: var(--text-dim); margin: 0 auto 28px; max-width: 46ch; }
  .contact-grid { position: relative; display: flex; justify-content: center; flex-wrap: wrap; gap: 16px; }
  .icon-link { position: relative; width: 62px; height: 62px; display: grid; place-items: center; border-radius: 18px; cursor: pointer;
    background: var(--bg-elev); border: 1px solid var(--line); color: var(--text); text-decoration: none; font-family: inherit;
    transition: transform .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease; }
  .icon-link:hover { transform: translateY(-5px) scale(1.05); border-color: var(--trace); color: var(--trace); box-shadow: 0 12px 26px var(--glow); }
  .icon-link svg { width: 26px; height: 26px; }
  .icon-link::after { content: attr(data-label); position: absolute; bottom: -26px; left: 50%; transform: translateX(-50%);
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; opacity: 0; transition: opacity .2s ease; }
  .icon-link:hover::after { opacity: 1; }
  .copy-note { position: relative; font-family: var(--font-mono); font-size: 12px; color: var(--trace); margin: 40px 0 0; min-height: 16px; }

  footer { padding: 48px 24px 56px; text-align: center; color: var(--text-dim); font-family: var(--font-mono); font-size: 12px; }

  /* reveal */
  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s ease; }
  .reveal.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .avatar::before, .dot, .cursor { animation: none; }
  }

  @media (max-width: 720px) {
    .hero-inner { grid-template-columns: 1fr; }
    .avatar { order: -1; width: 120px; height: 120px; font-size: 38px; }
    header.hero { padding: 64px 0 48px; }
    .stats { grid-template-columns: 1fr; margin-top: 40px; }
    nav.topnav ul { gap: 14px; }
    .nav-name { display: none; }
    details.project { padding: 2px 18px; }
  }

  [hidden] { display: none !important; }
  button.btn { cursor: pointer; font-family: inherit; }
  .avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }

  /* editor */
  .ed-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
    padding: 14px 72px 14px clamp(24px, 5vw, 72px); background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .ed-bar b { font-size: 1.1rem; }
  .ed-status { font-family: var(--font-mono); font-size: 12px; color: var(--trace); margin-left: 12px; }
  .ed-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .ed-actions .btn { padding: 9px 16px; }
  .ed-main { max-width: 920px; margin: 0 auto; padding: 32px clamp(24px, 5vw, 72px) 90px; }
  .ed-note { color: var(--text-dim); font-size: 14px; margin: 0 0 24px; }
  .ed-card { background: var(--bg-card); border: 1px solid var(--line); border-radius: 16px; padding: 24px; margin-bottom: 20px; }
  .ed-h { margin: 0 0 18px; font-size: 1.15rem; }
  .f { display: grid; gap: 6px; margin-bottom: 14px; font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .f input, .f textarea { width: 100%; background: var(--bg-elev); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font: 15px var(--font-head); resize: vertical; }
  .f input:focus, .f textarea:focus { outline: none; border-color: var(--trace); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .li { border: 1px dashed var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .li-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .li-h button { background: var(--bg-elev); color: var(--text); border: 1px solid var(--line); border-radius: 8px; width: 30px; height: 30px; cursor: pointer; margin-left: 6px; }
  .filerow, .photo-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .photo-row { margin-bottom: 18px; gap: 18px; }
  .filebtn { cursor: pointer; }
  .fname { font-size: 13px; color: var(--text); font-family: var(--font-mono); }
  .ph { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; display: grid; place-items: center; font-size: 30px; font-weight: 700; background: var(--bg-elev); border: 1px solid var(--line); }
  .chk { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .skill-edit { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 16px; }
  .skill-chip { display: inline-flex; align-items: center; gap: 7px; font-family: var(--font-mono); font-size: 13px; padding: 6px 8px 6px 14px;
    border-radius: 999px; background: var(--bg-elev); border: 1px solid var(--line); }
  .chip-x { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 4px; border-radius: 50%; }
  .chip-x:hover { color: #f87171; background: color-mix(in srgb, #f87171 15%, transparent); }
  .skill-add { display: flex; gap: 10px; }
  .skill-add input { flex: 1; background: var(--bg-elev); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 11px 13px; font: 15px var(--font-head); }
  .skill-add input:focus { outline: none; border-color: var(--trace); }
  .ed-div { border: none; border-top: 1px dashed var(--line); margin: 22px 0 18px; }
  .ed-h2 { margin: 0 0 8px; font-size: 1rem; }
  .gate-link { background: none; border: none; color: var(--trace); font-family: var(--font-mono); font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; }
  .rc-box { font-family: var(--font-mono); font-size: 18px; letter-spacing: 2px; text-align: center; word-break: break-all;
    padding: 16px; margin: 4px 0 14px; border-radius: 12px; background: var(--bg-elev); border: 1px dashed var(--trace); color: var(--trace); }
  .btn[disabled] { opacity: .45; cursor: not-allowed; transform: none !important; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; z-index: 60; background: var(--bg-elev); color: var(--text);
    border: 1px solid var(--line); padding: 10px 18px; border-radius: 10px; font-family: var(--font-mono); font-size: 13px; box-shadow: var(--shadow); transition: opacity .25s ease, transform .25s ease; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  footer { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; touch-action: manipulation; cursor: default; }
  .gate { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 24px;
    background: color-mix(in srgb, var(--bg) 70%, transparent); backdrop-filter: blur(8px); }
  .gate-card { width: 100%; max-width: 400px; background: var(--bg-card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; box-shadow: var(--shadow); }
  .gate-card h3 { margin: 0 0 6px; font-size: 1.25rem; }
  .gate-card p { margin: 0 0 18px; color: var(--text-dim); font-size: 14px; }
  .gate-card p.gate-err { color: #f87171; font-family: var(--font-mono); font-size: 12px; min-height: 16px; margin: 0 0 12px; }
  .gate-actions { display: flex; gap: 10px; }
  @media (max-width: 720px) { .row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="progress" id="progress"></div>
<button class="theme-toggle" id="themeToggle" aria-label="Switch between dark and light theme" title="Switch theme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
<div id="site" hidden=""></div>
<div id="editor"></div>
<div id="gate" class="gate" hidden=""></div>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="site-data">
{
  "name": "Dilli Raj Bhatta",

          if (!already) { E.skillsExtra = E.skillsExtra || []; E.skillsExtra.push(nv); }
          E.skillsHidden = (E.skillsHidden || []).filter(function (h) { return h.toLowerCase() !== nv.toLowerCase(); });
        }
      }
      else if (a === 'export') { exportHTML(); return; }
      else if (a === 'ghpublish') { publishToGitHub(); return; }
      else if (a === 'setpw') {
        var n1 = $('npw').value, n2 = $('npw2').value;
        if (!(window.crypto && crypto.subtle)) { toast('Password lock needs a secure (https) page'); return; }
        if (pwWeak(n1)) { toast(PW_HINT); return; }
        if (n1 !== n2) { toast('Passwords do not match'); return; }
        var sl = rand(); var h = await hashPw(n1, sl); if (!E) return; E.pw = { s: sl, h: h }; renderEditor(); queueSave(); toast('Password updated'); return;
      }
      else if (a === 'genrc') {
        if (!(window.crypto && crypto.subtle)) { toast('Recovery codes need a secure (https) page'); return; }
        var newCode = genRecoveryCode(); var rc = await hashCode(newCode); if (!E) return; revealedRC = newCode; E.rc = rc; renderEditor(); queueSave(); return;
      }
      else if (a === 'copyrc') { copyBtnHandler(function () { return revealedRC; }, $('rcNote2')); return; }
      else if (a === 'hiderc') { revealedRC = ''; renderEditor(); return; }
      else if (a === 'reset') {
        if (!resetArmed) { resetArmed = true; b.textContent = 'Click again to confirm'; setTimeout(function () { resetArmed = false; var r = $('resetBtn'); if (r) r.textContent = 'Reset'; }, 3000); return; }
        resetArmed = false; await clearSaved(); data = clone(DEF); E = clone(data); renderEditor(); toast('Reset to the original content'); return;
      } else return;
      renderEditor(); queueSave(); return;
    }
    var nm = e.target.closest && e.target.closest('.nav-name'); if (nm) {
      e.preventDefault();
      var h = $('hero'); if (h) h.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' });
      history.replaceState(null, '', location.pathname + location.search);
      return;
    }
    var cb = e.target.closest && e.target.closest('#copyEmail'); if (cb) {
      var em = cb.dataset.email, note = $('copyNote');
      var done = function (ok) { note.textContent = ok ? 'Copied ' + em : em; setTimeout(function () { note.textContent = ''; }, 2500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(em).then(function () { done(true); }, function () { done(false); }); else done(false);
    }
  });

  // ---------- password gate ----------
  var unlocked = false, attempts = 0;
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  var rand = function () { return Array.from(crypto.getRandomValues(new Uint8Array(16))).map(function (b) { return b.toString(16).padStart(2, '0'); }).join(''); };
  var PW_MIN = 10;
  function pwWeak(pw) { return pw.length < PW_MIN || !/[a-zA-Z]/.test(pw) || !/[0-9]/.test(pw); }
  var PW_HINT = 'Use at least ' + PW_MIN + ' characters, including both letters and numbers.';
  async function hashPw(pw, salt) {
    var enc = new TextEncoder(), key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
    var bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode(salt), iterations: 400000, hash: 'SHA-256' }, key, 256);
    return Array.from(new Uint8Array(bits)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  var RC_ALPHABET = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L, avoids look-alikes
  function genRecoveryCode() {
    var bytes = crypto.getRandomValues(new Uint8Array(16));
    var chars = Array.from(bytes).map(function (b) { return RC_ALPHABET[b % RC_ALPHABET.length]; });
    var groups = []; for (var i = 0; i < 16; i += 4) groups.push(chars.slice(i, i + 4).join(''));
    return groups.join('-');
  }
  function normalizeCode(s) { return String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); }
  async function hashCode(code) { var sl = rand(); return { s: sl, h: await hashPw(normalizeCode(code), sl) }; }
  function copyBtnHandler(getText, note) {
    var t = getText();
    var done = function (ok) { note.textContent = ok ? 'Copied to clipboard' : t; setTimeout(function () { note.textContent = ''; }, 2500); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { done(true); }, function () { done(false); }); else done(false);
  }

  var gateView = 'login', pendingCode = '', pendingNote = '';
  function openGate(view) {
    view = view || 'login';
    var setup = !(data.pw && data.pw.h);
    if (view === 'recover' && (setup || !(data.rc && data.rc.h))) view = 'login';
    gateView = view;
    var g = $('gate'); g.hidden = false;

    if (gateView === 'login') {
      var forgot = !setup && data.rc && data.rc.h
        ? '<p style="text-align:center;margin:16px 0 0"><button type="button" class="gate-link" data-g="recover">Forgot password?</button></p>' : '';
      g.innerHTML = '<form class="gate-card" id="gateForm" autocomplete="off"><h3>' + (setup ? 'Create an editor password' : 'Editor locked') + '</h3>' +
        '<p>' + (setup ? 'Choose a password (' + PW_HINT.charAt(0).toLowerCase() + PW_HINT.slice(1) + '). You will need it every time you open the editor. On the next screen you\'ll get a one-time recovery code — save it somewhere safe in case you forget this password.' : 'Enter your password to open the editor.') + '</p>' +
        '<label class="f"><span>' + (setup ? 'New password' : 'Password') + '</span><input type="password" id="gpw" autocomplete="' + (setup ? 'new-password' : 'current-password') + '"></label>' +
        (setup ? '<label class="f"><span>Confirm password</span><input type="password" id="gpw2" autocomplete="new-password"></label>' : '') +
        '<p class="gate-err" id="gerr"></p><div class="gate-actions"><button class="btn primary" type="submit">' + (setup ? 'Set password' : 'Unlock') + '</button>' +
        '<button class="btn ghost" type="button" data-g="cancel">Cancel</button></div>' + forgot + '</form>';
    } else if (gateView === 'recover') {
      g.innerHTML = '<form class="gate-card" id="gateForm" autocomplete="off"><h3>Reset with recovery code</h3>' +
        '<p>Enter the recovery code you saved when you first set your password.</p>' +
        '<label class="f"><span>Recovery code</span><input id="rcode" autocomplete="off" spellcheck="false" placeholder="XXXX-XXXX-XXXX-XXXX"></label>' +
        '<label class="f"><span>New password</span><input type="password" id="npw1" autocomplete="new-password"></label>' +
        '<label class="f"><span>Confirm new password</span><input type="password" id="npw2b" autocomplete="new-password"></label>' +
        '<p class="gate-err" id="gerr"></p><div class="gate-actions"><button class="btn primary" type="submit">Reset password</button>' +
        '<button class="btn ghost" type="button" data-g="back">Back</button></div></form>';
    } else if (gateView === 'showcode') {
      g.innerHTML = '<div class="gate-card"><h3>Save your recovery code</h3>' +
        '<p>' + esc(pendingNote) + ' This code works once. Anyone with it can reset your password, so keep it somewhere private — a password manager is ideal. It will not be shown again.</p>' +
        '<div class="rc-box" id="rcBox">' + esc(pendingCode) + '</div>' +
        '<button type="button" class="btn ghost" data-g="copyrc" style="width:100%;margin-bottom:14px">Copy code</button>' +
        '<label class="chk" style="margin-bottom:14px"><input type="checkbox" id="rcAck"> I\'ve saved this code somewhere safe</label>' +
        '<p class="copy-note" id="rcNote"></p>' +
        '<div class="gate-actions"><button type="button" class="btn primary" id="rcContinue" disabled data-g="continue">Continue</button></div></div>';
      $('rcAck').addEventListener('change', function () { $('rcContinue').disabled = !this.checked; });
    }
    setTimeout(function () { var i = g.querySelector('input:not([type=checkbox])'); if (i) i.focus(); }, 50);
  }
  function closeGate() { var g = $('gate'); g.hidden = true; g.innerHTML = ''; gateView = 'login'; }
  document.addEventListener('submit', async function (e) {
    if (e.target.id !== 'gateForm') return;
    e.preventDefault();
    var err = $('gerr'); if (err) err.textContent = '';
    if (!(window.crypto && crypto.subtle)) { if (err) err.textContent = 'The password lock needs a secure (https) page.'; return; }

    if (gateView === 'login') {
      var setup = !(data.pw && data.pw.h), pw = $('gpw').value;
      if (setup) {
        if (pwWeak(pw)) { err.textContent = PW_HINT; return; }
        if (pw !== $('gpw2').value) { err.textContent = 'Passwords do not match.'; return; }
        var sl = rand(); data.pw = { s: sl, h: await hashPw(pw, sl) };
        pendingCode = genRecoveryCode(); data.rc = await hashCode(pendingCode); await persist(data);
        pendingNote = 'Your password is set.'; openGate('showcode'); return;
      } else if ((await hashPw(pw, data.pw.s)) !== data.pw.h) {
        attempts++; await sleep(Math.min(attempts, 5) * 500);
        err.textContent = 'Wrong password.'; $('gpw').value = ''; $('gpw').focus(); return;
      }
      unlocked = true; attempts = 0; route();

    } else if (gateView === 'recover') {
      var code = $('rcode').value, np = $('npw1').value, np2 = $('npw2b').value;
      if (!normalizeCode(code)) { err.textContent = 'Enter your recovery code.'; return; }
      if (pwWeak(np)) { err.textContent = PW_HINT + ' (for the new password)'; return; }
      if (np !== np2) { err.textContent = 'Passwords do not match.'; return; }
      if ((await hashPw(normalizeCode(code), data.rc.s)) !== data.rc.h) {
        attempts++; await sleep(Math.min(attempts, 5) * 500);
        err.textContent = 'That recovery code is not correct.'; return;
      }
      var sl2 = rand(); data.pw = { s: sl2, h: await hashPw(np, sl2) };
      pendingCode = genRecoveryCode(); data.rc = await hashCode(pendingCode); await persist(data);
      attempts = 0; pendingNote = 'Your password has been reset. Your old recovery code no longer works.'; openGate('showcode');
    }
  });
  document.addEventListener('click', function (e) {
    var g = e.target.closest && e.target.closest('[data-g]'); if (!g) return;
    var act = g.dataset.g;
    if (act === 'cancel') location.hash = '';
    else if (act === 'back') openGate('login');
    else if (act === 'recover') openGate('recover');
    else if (act === 'copyrc') copyBtnHandler(function () { return pendingCode; }, $('rcNote'));
    else if (act === 'continue') { pendingCode = ''; unlocked = true; attempts = 0; route(); }
  });

  // secret entrance: click the footer 10 times in a row (each click within 1.5s of the last)
  var fc = 0, ft = 0;
  document.addEventListener('click', function (e) {
    if (!(e.target.closest && e.target.closest('#site footer'))) return;
    var now = Date.now(); fc = now - ft < 1500 ? fc + 1 : 1; ft = now;
    if (fc >= 10) { fc = 0; location.hash = '#edit'; }
  });

  // ---------- routing: #edit shows the (locked) editor, anything else shows the portfolio ----------
  function route() {
    var want = location.hash === '#edit';
    if (want && !unlocked) {
      if (view !== 'site') { view = 'site'; $('site').hidden = false; $('editor').hidden = true; renderSite(); }
      openGate(); return;
    }
    closeGate();
    var v = want ? 'edit' : 'site'; if (v === view) return;
    var first = view === null;
    if (view === 'edit' && E) { clearTimeout(st); data = clone(E); persist(data); unlocked = false; revealedRC = ''; }
    view = v;
    $('site').hidden = v === 'edit'; $('editor').hidden = v !== 'edit';
    if (v === 'edit') { E = clone(data); renderEditor(); document.title = 'Editor — ' + data.name; } else { E = null; renderSite(); }
    if (first && v === 'site' && location.hash.length > 1 && $(location.hash.slice(1))) $(location.hash.slice(1)).scrollIntoView(); else if (!first) scrollTo(0, 0);
  }
  addEventListener('hashchange', route);
  (async function () {
    var s = await loadSaved();
    if (s) {
      if (typeof s.skills === 'string' && !s.skillsExtra) { s.skillsExtra = csv(s.skills); delete s.skills; }
      data = Object.assign(clone(DEF), s);
    }
    route();
  })();
})();
</script>
